# Every Monday (or by hand): new fan ports and recompilations on GitHub, listed in the "Port candidates" issue for review.
name: Discover ports
on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discover.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
